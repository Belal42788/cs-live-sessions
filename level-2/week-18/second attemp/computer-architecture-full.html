<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Architecture - Full Lesson</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#193cff;--accent:#00d4aa;--bg:#0a0e27;--card:#111638;--card-hover:#1a2050;--text:#fff;--dim:#8892b0;--success:#00ff88;--danger:#ff4757;--warn:#ffd700;--s1:#06B6D4;--s2:#F59E0B;--s3:#8B5CF6;--s4:#10B981;--s5:#EC4899;--s6:#EF4444;--s7:#193cff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}
.bg-anim{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;overflow:hidden}
.bg-anim::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 50%,rgba(25,60,255,.1) 0%,transparent 50%),radial-gradient(circle at 70% 80%,rgba(0,212,170,.08) 0%,transparent 40%);animation:bgF 20s ease-in-out infinite}
@keyframes bgF{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-5%,5%) rotate(5deg)}}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.particle{position:absolute;width:4px;height:4px;background:var(--primary);border-radius:50%;opacity:.3;animation:pFloat 15s infinite linear}
@keyframes pFloat{0%{transform:translateY(100vh) rotate(0);opacity:0}10%{opacity:.3}90%{opacity:.3}100%{transform:translateY(-100vh) rotate(720deg);opacity:0}}
.nav{position:fixed;top:0;left:0;right:0;background:rgba(10,14,39,.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(25,60,255,.3);padding:15px 30px;z-index:1000;display:flex;justify-content:space-between;align-items:center;transform:translateY(-100%);transition:transform .5s cubic-bezier(.4,0,.2,1)}
.nav.visible{transform:translateY(0)}
.nav-links{display:flex;gap:8px;overflow-x:auto;padding:5px}
.nav-links::-webkit-scrollbar{display:none}
.nav a{text-decoration:none;color:var(--dim);padding:10px 18px;border-radius:25px;font-size:13px;font-weight:600;white-space:nowrap;transition:all .3s;border:1px solid transparent}
.nav a:hover,.nav a.active{color:var(--text);background:rgba(25,60,255,.2);border-color:var(--primary)}
.logo-nav{height:35px;border-radius:8px}
.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;position:relative}
.hero-badge{display:inline-block;padding:8px 20px;background:rgba(25,60,255,.2);border:1px solid var(--primary);border-radius:30px;font-size:14px;margin-bottom:30px;animation:fUp .8s ease-out}
.hero h1{font-size:clamp(36px,8vw,80px);font-weight:900;line-height:1.1;margin-bottom:20px;animation:fUp .8s ease-out .2s both}
.hero h1 span{background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{font-size:20px;color:var(--dim);max-width:600px;animation:fUp .8s ease-out .4s both}
.hero .start-btn{margin-top:30px;padding:15px 40px;background:var(--primary);color:var(--text);border:none;border-radius:30px;font-family:'Cairo';font-size:18px;font-weight:700;cursor:pointer;transition:all .3s;animation:fUp .8s ease-out .6s both}
.hero .start-btn:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(25,60,255,.5)}
.scroll-ind{position:absolute;bottom:40px;animation:bounce 2s infinite}
.scroll-ind svg{width:40px;height:40px;stroke:var(--primary)}
@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0)}40%{transform:translateY(-20px)}60%{transform:translateY(-10px)}}
@keyframes fUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes fLeft{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
@keyframes sIn{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(25,60,255,.3)}50%{box-shadow:0 0 40px rgba(25,60,255,.6)}}
.section{min-height:100vh;padding:100px 20px;display:flex;align-items:center;justify-content:center}
.section-inner{max-width:1200px;width:100%;opacity:0;transform:translateY(60px);transition:all .8s cubic-bezier(.4,0,.2,1)}
.section-inner.visible{opacity:1;transform:translateY(0)}
.section-header{text-align:center;margin-bottom:60px}
.section-number{display:inline-flex;width:60px;height:60px;background:linear-gradient(135deg,var(--primary),var(--accent));border-radius:20px;align-items:center;justify-content:center;font-size:24px;font-weight:900;margin:0 auto 20px;animation:glow 3s infinite}
.section-header h2{font-size:clamp(28px,5vw,48px);font-weight:900;margin-bottom:15px}
.section-header p{color:var(--dim);font-size:18px;max-width:600px;margin:0 auto}
.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
@media(max-width:900px){.content-grid{grid-template-columns:1fr}}
